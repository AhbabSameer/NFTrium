[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
# Seed.s.sol reads script/seed-manifest.json
fs_permissions = [{ access = "read", path = "./script" }]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[lint]
# `nft` stays lowercase so the public getter reads naturally in the ABI.
exclude_lints = ["screaming-snake-case-immutable"]

[fmt]
line_length = 110

[rpc_endpoints]
sepolia = "https://ethereum-sepolia-rpc.publicnode.com"
anvil = "http://127.0.0.1:8545"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
